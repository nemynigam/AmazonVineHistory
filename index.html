<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Production & Product Monitor</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #06090e;
      --card-bg: #0f172a;
      --accent-blue: #38bdf8;
      --neon-green: #22c55e;
      --border-color: rgba(255, 255, 255, 0.1);
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: #f8fafc; padding: 16px; min-height: 100vh; }
    .container { max-width: 100%; margin: 0 auto; }

    /* Top Live Monitoring Header */
    .hero-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      gap: 14px;
      margin-bottom: 16px;
    }

    .hero-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .hero-card.count-card {
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.12) 0%, rgba(15, 23, 42, 0.9) 100%);
      border: 1px solid rgba(34, 197, 94, 0.4);
    }

    .hero-card.time-card {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.12) 0%, rgba(15, 23, 42, 0.9) 100%);
      border: 1px solid rgba(56, 189, 248, 0.4);
    }

    .card-label {
      font-size: 13px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    /* Bada Display Font */
    .count-display {
      font-size: 46px;
      font-weight: 900;
      color: var(--neon-green);
      line-height: 1.1;
      text-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
    }

    .time-display {
      font-size: 32px;
      font-weight: 800;
      color: var(--accent-blue);
      line-height: 1.1;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }

    .sub-timing {
      font-size: 12px;
      color: #cbd5e1;
      margin-top: 4px;
      font-weight: 600;
    }

    /* Live Badge */
    .status-area {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-end;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid rgba(34, 197, 94, 0.5);
      color: #4ade80;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
    }

    .pulse {
      width: 9px;
      height: 9px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse-ring 1.5s infinite;
    }

    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.8); }
      70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    /* Compact Screen-Fit Table */
    .table-container {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      overflow: hidden;
    }

    .table-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: #1e293b;
      border-bottom: 1px solid var(--border-color);
    }

    .search-bar {
      background: #090d16;
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 8px;
      color: white;
      font-size: 13px;
      width: 220px;
      outline: none;
    }

    .search-bar:focus { border-color: var(--accent-blue); }

    /* Auto-fit Table No Scroll */
    table {
      width: 100%;
      table-layout: auto;
      border-collapse: collapse;
      font-size: 12.5px;
    }

    th {
      background: #172033;
      color: #93c5fd;
      padding: 10px 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      text-align: left;
    }

    td {
      padding: 9px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: #e2e8f0;
      word-break: break-word;
      vertical-align: middle;
    }

    /* First row (Latest Item) Animation */
    tbody tr:first-child {
      background: rgba(56, 189, 248, 0.08);
      font-weight: 600;
      border-left: 3px solid var(--accent-blue);
    }

    tbody tr:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .chip {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 11px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-blue);
    }

    .chip-time {
      background: rgba(168, 85, 247, 0.15);
      color: #c084fc;
    }

    @media (max-width: 900px) {
      .hero-grid { grid-template-columns: 1fr; }
      .count-display { font-size: 38px; }
      .time-display { font-size: 26px; }
      table { font-size: 11.5px; }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- Big Hero Monitoring Metrics -->
  <div class="hero-grid">
    
    <!-- 1. Jumbo Live Product Count -->
    <div class="hero-card count-card">
      <div class="card-label">📦 Live Product Count</div>
      <div class="count-display" id="totalCount">0</div>
      <div class="sub-timing">Total Items Logged in Sheet</div>
    </div>

    <!-- 2. Big Live Sync & Last Product Time -->
    <div class="hero-card time-card">
      <div class="card-label">⏱️ Last Product Timing</div>
      <div class="time-display" id="lastProductTime">--:--:--</div>
      <div class="sub-timing" id="lastSyncAgo">Syncing...</div>
    </div>

    <!-- 3. System Live Sync Status -->
    <div class="hero-card status-area">
      <div class="live-badge">
        <div class="pulse"></div>
        LIVE SYNC (1.5s)
      </div>
      <div style="text-align: right;">
        <div style="font-size: 11px; color: var(--text-muted);">CURRENT CLOCK</div>
        <div id="liveClock" style="font-size: 18px; font-weight: 800; color: #ffffff;">--:--:--</div>
      </div>
    </div>

  </div>

  <!-- Screen-Fit Compact Table -->
  <div class="table-container">
    <div class="table-header-bar">
      <div style="font-size: 14px; font-weight: 700; color: #e2e8f0;">⚡ Real-Time Product Feed (Newest First)</div>
      <input type="text" id="searchBox" class="search-bar" placeholder="🔍 Search item / time..." onkeyup="filterRows()">
    </div>

    <table id="mainTable">
      <thead id="tblHead"></thead>
      <tbody id="tblBody">
        <tr><td colspan="10" style="text-align: center; padding: 25px; color: var(--text-muted);">Connecting to Sheet...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
  const SHEET_ID = "1nzoYDw45bUiZ5dD-q6n78NNpsLufNUDBkgKOQPAAh-M";
  const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

  let cachedData = [];

  // Live Digital Clock
  setInterval(() => {
    document.getElementById("liveClock").innerText = new Date().toLocaleTimeString();
  }, 1000);

  // Fetch Continuous Updates
  async function fetchLiveFeed() {
    try {
      const res = await fetch(`${GVIZ_URL}&t=${Date.now()}`);
      const text = await res.text();
      const json = JSON.parse(text.substring(text.indexOf("{"), text.lastIndexOf("}") + 1));

      const cols = json.table.cols.map(c => c ? c.label || "Col" : "Col");
      const rows = json.table.rows.map(r => r.c.map(cell => cell ? (cell.f ? cell.f : cell.v) : ""));

      cachedData = [cols, ...rows];
      renderDashboard(cols, rows);
    } catch (e) {
      console.warn("Retrying fetch...", e);
    }
  }

  function renderDashboard(headers, rows) {
    if (!rows || rows.length === 0) return;

    // 1. Update Big Product Count
    document.getElementById("totalCount").innerText = rows.length;

    // 2. Identify and Sync Timing from Data
    const lastRow = rows[rows.length - 1]; // Sabse aakhiri entry
    let detectedTime = "";

    // Timing column auto-detect (AM/PM ya : format)
    for (let i = 0; i < lastRow.length; i++) {
      const val = String(lastRow[i]);
      if (val.includes(":") || val.toLowerCase().includes("am") || val.toLowerCase().includes("pm")) {
        detectedTime = val;
        break;
      }
    }

    if (detectedTime) {
      document.getElementById("lastProductTime").innerText = detectedTime;
      document.getElementById("lastSyncAgo").innerText = "Latest product logged at this timestamp";
    } else {
      document.getElementById("lastProductTime").innerText = new Date().toLocaleTimeString();
      document.getElementById("lastSyncAgo").innerText = "Updated just now";
    }

    // 3. Render Table (No Scroll, Newest First)
    const thead = document.getElementById("tblHead");
    const tbody = document.getElementById("tblBody");

    if (thead.innerHTML === "") {
      let h = "<tr>";
      headers.forEach(head => h += `<th>${head || '-'}</th>`);
      h += "</tr>";
      thead.innerHTML = h;
    }

    const query = document.getElementById("searchBox").value.toLowerCase();
    let b = "";

    // Newest record top par aayega
    for (let r = rows.length - 1; r >= 0; r--) {
      const row = rows[r];
      if (row.some(cell => String(cell).toLowerCase().includes(query))) {
        b += "<tr>";
        row.forEach(cell => {
          let v = cell !== null && cell !== undefined ? cell : "";
          
          // Smart formatting for Time & Numbers
          if (String(v).includes(":") && (String(v).includes("AM") || String(v).includes("PM") || String(v).length <= 11)) {
            v = `<span class="chip chip-time">⏱️ ${v}</span>`;
          } else if (typeof v === 'number') {
            v = `<span class="chip">${v}</span>`;
          }
          b += `<td>${v}</td>`;
        });
        b += "</tr>";
      }
    }
    tbody.innerHTML = b;
  }

  function filterRows() {
    if (cachedData.length > 1) {
      renderDashboard(cachedData[0], cachedData.slice(1));
    }
  }

  // Initial Fetch & fast 1.5s live polling
  fetchLiveFeed();
  setInterval(fetchLiveFeed, 1500);
</script>

</body>
</html>
