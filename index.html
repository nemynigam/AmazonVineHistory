<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ Live Production & Battery Monitor</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070b13;
      --card-bg: #0f172a;
      --accent-blue: #38bdf8;
      --neon-green: #22c55e;
      --neon-purple: #c084fc;
      --border: rgba(255, 255, 255, 0.08);
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: #f8fafc; padding: 16px; min-height: 100vh; }
    .container { max-width: 100%; margin: 0 auto; }

    /* Top Highlight Stats */
    .hero-grid {
      display: grid;
      grid-template-columns: 1.4fr 1.4fr 0.8fr;
      gap: 14px;
      margin-bottom: 16px;
    }

    .hero-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 22px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .hero-card.count-card {
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.12) 0%, rgba(15, 23, 42, 0.95) 100%);
      border: 1px solid rgba(34, 197, 94, 0.4);
    }

    .hero-card.time-card {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.12) 0%, rgba(15, 23, 42, 0.95) 100%);
      border: 1px solid rgba(56, 189, 248, 0.4);
    }

    .card-label {
      font-size: 12px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    /* Jumbo Highlights */
    .count-display {
      font-size: 48px;
      font-weight: 900;
      color: var(--neon-green);
      line-height: 1;
      text-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
    }

    .time-display {
      font-size: 32px;
      font-weight: 800;
      color: var(--accent-blue);
      line-height: 1.1;
      text-shadow: 0 0 18px rgba(56, 189, 248, 0.35);
    }

    .sub-note {
      font-size: 11.5px;
      color: #94a3b8;
      margin-top: 6px;
      font-weight: 600;
    }

    .status-area {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-end;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #4ade80;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 800;
    }

    .pulse {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse-ring 1.5s infinite;
    }

    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.8); }
      70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    /* Screen-Fit Table Wrapper (Zero Horizontal Scroll) */
    .table-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      width: 100%;
    }

    .table-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: #172033;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 10px;
    }

    .search-bar {
      background: #090d16;
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      color: white;
      font-size: 13px;
      width: 220px;
      outline: none;
    }
    .search-bar:focus { border-color: var(--accent-blue); }

    /* Auto Column Sizing - Fits 100% Screen */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      table-layout: auto;
    }

    th {
      background: #111827;
      color: #93c5fd;
      padding: 12px 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: 11.5px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      text-align: left;
    }

    td {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: #e2e8f0;
      word-break: break-word;
      vertical-align: middle;
    }

    tbody tr:first-child {
      background: rgba(56, 189, 248, 0.08);
      font-weight: 600;
      border-left: 4px solid var(--accent-blue);
    }

    tbody tr:hover { background: rgba(255, 255, 255, 0.04); }

    .chip {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 5px;
      font-weight: 700;
      font-size: 12px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-blue);
    }

    .chip-time {
      background: rgba(192, 132, 252, 0.15);
      color: var(--neon-purple);
    }

    @media (max-width: 900px) {
      .hero-grid { grid-template-columns: 1fr; }
      .count-display { font-size: 38px; }
      .time-display { font-size: 26px; }
    }
  </style>
</head>
<body>

<div class="container">

  <div class="hero-grid">
    
    <div class="hero-card count-card">
      <div class="card-label">📦 Total Active Product (Sheet Value)</div>
      <div class="count-display" id="totalCount">--</div>
      <div class="sub-note">Live value from Google Sheet</div>
    </div>

    <div class="hero-card time-card">
      <div class="card-label">⏱️ Last Sync Time (Sheet Value)</div>
      <div class="time-display" id="lastSyncTime">--:--:--</div>
      <div class="sub-note">Latest timestamp logged in sheet</div>
    </div>

    <div class="hero-card status-area">
      <div class="live-badge">
        <div class="pulse"></div>
        LIVE SYNC (1.5s)
      </div>
      <div style="text-align: right;">
        <div style="font-size: 11px; color: var(--text-muted); font-weight: 700;">BROWSER CLOCK</div>
        <div id="liveClock" style="font-size: 16px; font-weight: 800; color: #ffffff;">--:--:--</div>
      </div>
    </div>

  </div>

  <div class="table-container">
    <div class="table-header-bar">
      <div style="font-size: 13.5px; font-weight: 700; color: #e2e8f0;">⚡ Live Product Records (Top = Latest)</div>
      <input type="text" id="searchBox" class="search-bar" placeholder="🔍 Search records..." onkeyup="filterRows()">
    </div>

    <table id="mainTable">
      <thead id="tblHead"></thead>
      <tbody id="tblBody">
        <tr><td colspan="10" style="text-align: center; padding: 25px; color: var(--text-muted);">Connecting to Sheet Data...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
  // Sheet ID direct live endpoint (No caching delay)
  const SHEET_ID = "1nzoYDw45bUiZ5dD-q6n78NNpsLufNUDBkgKOQPAAh-M";
  const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

  let cachedHeaders = [];
  let cachedRows = [];

  // Browser Clock
  setInterval(() => {
    document.getElementById("liveClock").innerText = new Date().toLocaleTimeString();
  }, 1000);

  // Live Sheet Data Fetcher
  async function fetchLiveFeed() {
    try {
      const res = await fetch(`${GVIZ_URL}&t=${Date.now()}`);
      const text = await res.text();
      const json = JSON.parse(text.substring(text.indexOf("{"), text.lastIndexOf("}") + 1));

      // Extract Headers and Matrix Rows
      const cols = json.table.cols.map(c => c ? c.label || "" : "");
      const rows = json.table.rows.map(r => r.c.map(cell => cell ? (cell.f ? cell.f : cell.v) : ""));

      cachedHeaders = cols;
      cachedRows = rows;
      renderDashboard(cols, rows);
    } catch (err) {
      console.warn("Live fetch error, retrying...", err);
    }
  }

  function renderDashboard(headers, rows) {
    if (!rows || rows.length === 0) return;

    let totalActiveVal = null;
    let lastSyncVal = null;

    // 1. JSON में से "Active Product" और "Sync Time" को मैप करें
    headers.forEach((h, colIdx) => {
      const head = String(h).toLowerCase().trim();
      
      if (head.includes("active") || head.includes("total") || head.includes("count") || head.includes("product")) {
        // अगर कॉलम में ऊपर या नीचे वैल्यू है तो उसे पिक करें
        for (let r = rows.length - 1; r >= 0; r--) {
          if (rows[r][colIdx] !== "" && rows[r][colIdx] !== null && rows[r][colIdx] !== undefined) {
            totalActiveVal = rows[r][colIdx];
            break;
          }
        }
      }

      if (head.includes("sync") || head.includes("time") || head.includes("date") || head.includes("timestamp")) {
        for (let r = rows.length - 1; r >= 0; r--) {
          if (rows[r][colIdx] !== "" && rows[r][colIdx] !== null && rows[r][colIdx] !== undefined) {
            lastSyncVal = rows[r][colIdx];
            break;
          }
        }
      }
    });

    // Fallback: अगर हेडर मैच नहीं हुआ तो लास्ट रो से वैल्यू निकालें
    if (totalActiveVal === null) {
      totalActiveVal = rows[rows.length - 1][0] || rows.length;
    }
    if (lastSyncVal === null) {
      const lastRow = rows[rows.length - 1];
      for (let item of lastRow) {
        if (String(item).includes(":") || String(item).toLowerCase().includes("am") || String(item).toLowerCase().includes("pm")) {
          lastSyncVal = item;
          break;
        }
      }
    }

    // 2. UI पर सेट करें
    document.getElementById("totalCount").innerText = totalActiveVal;
    if (lastSyncVal) {
      document.getElementById("lastSyncTime").innerText = lastSyncVal;
    }

    // 3. Screen-fit Table Render (Newest Row on Top)
    renderTable(headers, rows);
  }

  function renderTable(headers, rows) {
    const thead = document.getElementById("tblHead");
    const tbody = document.getElementById("tblBody");

    if (thead.innerHTML === "") {
      let hHtml = "<tr>";
      headers.forEach(h => hHtml += `<th>${h || '-'}</th>`);
      hHtml += "</tr>";
      thead.innerHTML = hHtml;
    }

    const query = document.getElementById("searchBox").value.toLowerCase();
    let bHtml = "";

    // Newest record sabse upar
    for (let r = rows.length - 1; r >= 0; r--) {
      const row = rows[r];
      if (row.some(cell => String(cell).toLowerCase().includes(query))) {
        bHtml += "<tr>";
        row.forEach(cell => {
          let val = cell !== null && cell !== undefined ? cell : "";
          
          if (String(val).includes(":") && (String(val).includes("AM") || String(val).includes("PM") || String(val).length <= 12)) {
            val = `<span class="chip chip-time">⏱️ ${val}</span>`;
          } else if (typeof val === 'number') {
            val = `<span class="chip">${val}</span>`;
          }
          bHtml += `<td>${val}</td>`;
        });
        bHtml += "</tr>";
      }
    }
    tbody.innerHTML = bHtml;
  }

  function filterRows() {
    if (cachedRows.length > 0) {
      renderTable(cachedHeaders, cachedRows);
    }
  }

  // Initial Fetch & 1.5s continuous live update
  fetchLiveFeed();
  setInterval(fetchLiveFeed, 1500);
</script>

</body>
</html>
